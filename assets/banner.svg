<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="tealGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#0284c7"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="30"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1.2deg)}}@keyframes floatFast{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.65;transform:scale(1.1)}}@keyframes dashFlow{0%{stroke-dashoffset:400}}.floating-card-1{animation:floatSlow 6s ease-in-out infinite}.floating-card-2{animation:floatFast 5s ease-in-out infinite 1s}.pulse-bg{animation:pulseGlow 7s ease-in-out infinite alternate}.flow-line{stroke-dasharray:8 6;animation:dashFlow 20s linear infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)"/><g opacity=".15"><line x1="0" x2="1200" y1="60" y2="60" stroke="#6366f1" stroke-width="1"/><line x1="0" x2="1200" y1="120" y2="120" stroke