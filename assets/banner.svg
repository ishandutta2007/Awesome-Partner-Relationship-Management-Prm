<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.2deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.1); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .floating-card-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card-2 { animation: floatFast 5s ease-in-out infinite 1s; }
      .pulse-bg { animation: pulseGlow 7s ease-in-out infinite alternate; }
      .flow-line { stroke-dasharray: 8 6; animation: dashFlow 20s linear infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Subtle Dynamic Tech Grid / Network Lines (Behind Foreground) -->
  <g opacity="0.15">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#6366f1" stroke-width="1" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#6366f1" stroke-width="1" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#6366f1" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#6366f1" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#6366f1" stroke-width="1" />
    <line x1="200" y1="0" x2="200" y2="360" stroke="#6366f1" stroke-width="1" />
    <line x1="400" y1="0" x2="400" y2="360" stroke="#6366f1" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#6366f1" stroke-width="1" />
    <line x1="800" y1="0" x2="800" y2="360" stroke="#6366f1" stroke-width="1" />
    <line x1="1000" y1="0" x2="1000" y2="360" stroke="#6366f1" stroke-width="1" />
  </g>

  <!-- Glowing Ambient Spheres -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#softGlow)" class="pulse-bg" />
  <circle cx="1060" cy="270" r="160" fill="#a855f7" filter="url(#softGlow)" class="pulse-bg" />

  <!-- Animated Connection / Flow Curve in Background -->
  <path d="M 50 310 Q 300 240, 580 320 T 1150 200" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.35" class="flow-line" />
  <path d="M 100 50 Q 400 120, 800 60 T 1180 140" fill="none" stroke="url(#tealGrad)" stroke-width="2" opacity="0.25" class="flow-line" />

  <!-- Floating Decorative Cards in Background (positioned away from title) -->
  <g class="floating-card-1" opacity="0.4" transform="translate(980, 50)">
    <rect width="160" height="70" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="28" cy="35" r="12" fill="#38bdf8" opacity="0.6" />
    <rect x="50" y="24" width="80" height="8" rx="4" fill="#cbd5e1" opacity="0.8" />
    <rect x="50" y="38" width="55" height="6" rx="3" fill="#94a3b8" opacity="0.5" />
  </g>

  <g class="floating-card-2" opacity="0.35" transform="translate(60, 240)">
    <rect width="170" height="65" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="28" cy="32" r="12" fill="#a855f7" opacity="0.6" />
    <rect x="50" y="22" width="90" height="8" rx="4" fill="#cbd5e1" opacity="0.8" />
    <rect x="50" y="36" width="60" height="6" rx="3" fill="#94a3b8" opacity="0.5" />
  </g>

  <!-- FOREGROUND: Category Badges & Main Typography (Always on top) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 75)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="1.5" />
      <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c7d2fe" text-anchor="middle" letter-spacing="1.5">
        🤝 PARTNER RELATIONSHIP MANAGEMENT
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
      Awesome PRM Solutions
    </text>

    <!-- Subtitle (Gradient Fill) -->
    <text x="600" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="url(#primaryGrad)" text-anchor="middle">
      Curated SaaS Platforms, Partner Portals, Channel Ops &amp; Open-Source Stacks
    </text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(600, 275)">
      <!-- Tag 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle">⚡ Deal Registration</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0" text-anchor="middle">💼 Co-Selling &amp; Channel</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(90, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8" text-anchor="middle">💰 Commission Payouts</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(255, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fde047" text-anchor="middle">⭐ Open-Source Engines</text>
      </g>
    </g>
  </g>
</svg>
